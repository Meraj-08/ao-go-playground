# A pretend review bot so the PR view has bot comments to show.
name: Bot review
on:
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = Number(context.payload.pull_request?.number ?? context.payload.inputs.pr);
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            const { data: file } = await github.rest.repos.getContent({ owner, repo, path: ".github/review-notes.json", ref: pr.base.sha });
            const notes = JSON.parse(Buffer.from(file.content, "base64").toString())[pr.head.ref];
            if (!notes) return;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number });
            await github.rest.issues.createComment({
              owner, repo, issue_number: pull_number,
              body: [
                "### \u{1F916} taskr-bot summary",
                "",
                notes.summary,
                "",
                "| Check | Result |",
                "| --- | --- |",
                "| Files changed | " + files.length + " |",
                "| Tests added | " + (files.some((f) => f.filename.endsWith("_test.go")) ? "\u2705" : "\u26A0\uFE0F none") + " |",
                "| Inline notes | " + notes.comments.length + " |",
              ].join("\n"),
            });
            await github.rest.pulls.createReview({
              owner, repo, pull_number, event: "COMMENT", body: notes.review,
              comments: notes.comments.map((c) => ({ ...c, side: "RIGHT" })),
            });
